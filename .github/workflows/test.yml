name: test
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C test
        run: make -C test test_c && ./test/test_c
      - name: Build and run C++ test
        run: make -C test test_cpp && ./test/test_cpp
